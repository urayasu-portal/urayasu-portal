# 旅行ガイド共通の事実データ（単一情報源）
#
# 使い方: 記事本文で {{< fact "limousine.haneda_fare" >}} のように参照する。
#   - 葉が {v: "...", u: yen} の形なら、fact ショートコードが言語別に通貨表記を付ける
#     （ja: 1,300円 / en: ¥1,300 / ko: 1,300엔 / zh: 1,300日元 / zh-tw: 1,300日圓）
#   - 葉がただの文字列ならそのまま出力する
# ルール:
#   - 値を更新したら checked を必ず更新する（記事側の factChecked の代わりにここで管理）
#   - 新しい事実を足すときは source（公式URL）を必ず書く
#   - frontmatter（FAQ等）ではショートコードが効かないため、本文のみで使用する

# ── 空港リムジンバス（東京空港交通ほか共同運行）─────────────────
# source: https://www.limousinebus.co.jp/ja/line/detail/Haneda-TDR/
# source: https://www.limousinebus.co.jp/ja/line/detail/Narita-TDR/
# source: https://www.limousinebus.co.jp/ja/guide/terms/baggage/
# checked: 2026-08-16
limousine:
  haneda_fare: { v: "1,300", u: yen }        # 羽田⇔TDR 大人
  haneda_fare_child: { v: "650", u: yen }    # 同 小児
  narita_fare: { v: "2,900", u: yen }        # 成田⇔TDR 大人
  narita_fare_child: { v: "1,450", u: yen }  # 同 小児
  baggage_per_person: "2"                    # 預け荷物 1名あたり個数
  baggage_size_limit: "50×60×120cm"          # 1個あたり上限サイズ
  baggage_weight_limit: "30kg"               # 1個あたり上限重量

# ── 空港送迎（予約制。浦安市・東京ディズニーリゾート発着）───────────────
# source: https://app.nearme.jp/airport-shuttle/ （羽田便のエリア別料金表「千葉県浦安市（東京ディズニーリゾートを含む）」）
# source: https://app.nearme.jp/airport-shuttle/airports/nrt/ （成田便の同表）
# source: https://www.airport-taxi.tokyo/jp/rates （ハイヤー料金表 千葉↔羽田空港／千葉↔成田空港 の「浦安市」「ディズニーランド」、オプションサービス）
# checked: 2026-10-22
# NearMe は相乗り（シェア乗り）の1人あたりの下限。日程・人数・乗降場所・早割で変わる。
# エアポートタクシーは1台あたりの参考料金（公式表記「あくまでも参考のための目安料金」。高速・ガソリン代込み、税込、5人乗りのアルファードクラス）。
#   加算：前日〜当日の予約（直前手配）、22:00〜翌5:59の予約（深夜早朝）、ミーティングサービス、経由地追加。
airport_transfer:
  nearme_haneda_share: { v: "3,980", u: yen }      # 羽田⇔浦安市 相乗り 1人〜
  nearme_narita_share: { v: "4,980", u: yen }      # 成田⇔浦安市 相乗り 1人〜
  airporttaxi_haneda: { v: "17,170", u: yen }      # 羽田⇔浦安市 貸切 1台（参考）
  airporttaxi_narita: { v: "28,290", u: yen }      # 成田⇔浦安市 貸切 1台（参考）
  airporttaxi_haneda_tdl: { v: "17,070", u: yen }  # 羽田⇔ディズニーランド 貸切 1台（参考）
  airporttaxi_narita_tdl: { v: "25,650", u: yen }  # 成田⇔ディズニーランド 貸切 1台（参考）
  airporttaxi_short_notice: { v: "2,000", u: yen } # 加算：前日〜当日の予約
  airporttaxi_late_night: { v: "3,500", u: yen }   # 加算：22:00〜翌5:59の予約

# ── 路線バス（浦安駅⇔舞浜駅／京成バス千葉ウエスト 千鳥営業所）───────
# source: https://transfer-cloud.navitime.biz/keiseibus-group （京成バスグループ公式 経路・運賃検索）
# source: https://transfer-cloud.navitime.biz/keiseibus-group/courses/timetables?busstop=00020739&course-sequence=0008200244-1 （9系統。通過時刻表で舞浜駅南口210円、6:10発→6:29着を確認）
# source: https://transfer-cloud.navitime.biz/keiseibus-group/courses/timetables?busstop=00020739&course-sequence=0008200206-1 （2系統。通過時刻表で舞浜駅南口280円、6:17発→6:43着を確認）
# checked: 2026-09-30
# 所要時間は概数。上記確認便は9系統19分、2系統26分。便・道路状況で変動する。
# 注意: 旧公式サイト baycity-bus.co.jp / transitbus.co.jp は2026年4月1日のリニューアルで閉鎖。
#       リンクするなら https://www.keiseibus.co.jp/ を使う。
#       9系統（舞浜線・堀江/富士見経由）が最安・最速。2系統（今川線・新浦安経由）は遠回りで高い。
local_bus:
  urayasu_maihama_fare: { v: "210", u: yen }     # 浦安駅入口→舞浜駅南口 9系統 大人（現金・IC同額）
  urayasu_maihama_minutes: "20"                  # 同 乗車時間（約19分・4.7km）
  urayasu_maihama_route: "9"                     # 系統番号（舞浜線）
  urayasu_maihama_fare_via_shin: { v: "280", u: yen }  # 2系統（今川線・新浦安経由）大人
  urayasu_maihama_minutes_via_shin: "25"         # 同 乗車時間（6.8km）

# ── JR運賃（京葉線ほか・ICカード大人片道）────────────────────
# 2026-03-14 の JR東日本運賃改定（電車特定区間・山手線内の運賃区分を廃止、IC運賃≦きっぷ運賃）後の値。
# source: https://travel.watch.impress.co.jp/docs/news/2036171.html （改定の概要）
# source: https://transit.yahoo.co.jp/ （Yahoo!路線情報で区間ごとに照合。JR東日本の運賃検索はWAFで自動取得不可のため代替）
# checked: 2026-10-16
# 注意: JRはクレジットカードのタッチ決済非対応（Suica/PASMOが必要）。
#       複数社にまたがるルート（例: 舞浜→八丁堀→日比谷線→神谷町 431円）の合計はここに入れず、本文で直書きする。
jr:
  maihama_tokyo: { v: "253", u: yen }            # 舞浜→東京 12.7km（旧230円）
  maihama_hatchobori: { v: "253", u: yen }       # 舞浜→八丁堀 11.5km
  maihama_akihabara: { v: "253", u: yen }        # 舞浜→東京→秋葉原 14.7km（京葉線＋山手線/京浜東北線）
  maihama_shibuya: { v: "440", u: yen }          # 舞浜→東京→渋谷 25km（京葉線＋山手線ほか）
  maihama_harajuku: { v: "440", u: yen }         # 舞浜→東京→原宿 25.2km（同上）
  maihama_shinkiba: { v: "199", u: yen }         # 舞浜→新木場 5.3km
  maihama_kasairinkai: { v: "155", u: yen }      # 舞浜→葛西臨海公園 2.1km
  maihama_ryogoku: { v: "341", u: yen }          # 舞浜→両国 JRのみ 16.6〜18.1km
  shinurayasu_tokyo: { v: "341", u: yen }        # 新浦安→東京 16.1km

# ── ハッピーエントリー ───────────────────────────────
# source: https://www.tokyodisneyresort.jp/hotel/topics/info/happy_entry.html （分数・対象外日。en/kr/sc/tc 版あり）
# source: https://faq.tokyodisneyresort.jp/answer/67eaa65f57951a27c885671c/
# checked: 2026-10-04（旧 source の hotel_privilege.html は提携ホテル特典のページでハッピーエントリーの記載が無かったため差し替え）
# 注意: 東京ディズニーシーは2025年9月から入口周辺の工事に伴い「5〜15分前」の変動制。
#       工事は2028年度終了予定。ランドは15分前のまま。
#       minutes は「ランドの分数」を指す。両パークをまとめて書く場合は both_label を使う。
happy_entry:
  minutes: "15"                              # 東京ディズニーランド：一般開園より早く入園できる分数
  land_minutes: "15"                         # ランド（同上・明示用）
  sea_minutes: "5〜15"                       # シー：工事に伴う変動制
  # 対象外日（公式「2026年9月24日現在」）。ショートコード {{< happy-entry-excluded >}} が表示する。
  #   ・ランドの対象外日は、ミラコスタ／ファンタジースプリングスホテル ファンタジーシャトー／セレブレーションホテルの宿泊者が利用不可
  #     （ファンタジースプリングスホテル グランドシャトーは利用可）
  #   ・日付は ISO 形式。ビルド日より前の日付はショートコードが自動で表示しない（手で消さなくてよい）
  #   ・through＝公式が決定済みとしている最終月。これを過ぎると日付一覧を出さず「公式で確認」の案内だけにする
  #   ・新しい日程が発表されたら（約4か月前）land_dates / sea_dates に追記し through と checked を更新する
  excluded:
    through: "2027-02"
    land_dates: ["2026-10-31", "2026-11-10", "2027-01-12"]
    sea_dates: []

# ── 舞浜駅の荷物サービス ─────────────────────────────
# 値ごとの出典（2026-10-04 に全値を照合し、出典を値ごとに整理）：
#   bon_voyage（800円・開店〜15:00）… https://www.tokyodisneyresort.jp/hotel/hotel_privilege.html の「パートナーホテル宿泊者特典」
#   welcome_center（2F 7:30〜16:00／1F 8:00〜15:00）… https://www.tokyodisneyresort.jp/tdr/facility/welcomecenter.html
#     （2F は FAQ ID:00119 https://faq.tokyodisneyresort.jp/answer/67eaa647f939746b30956686/ にも記載）
#   station_delivery.fee（800円）… FAQ ID:00364 https://faq.tokyodisneyresort.jp/answer/67eaa6537605a4cb7775bf21/（ディズニーホテル）
#     ／ https://tokyobay.hiltonjapan.co.jp/faq/rooms（オフィシャルホテルの例：ヒルトン東京ベイ）
#   station_delivery の受付 7:00〜12:30 … hotel_privilege.html の「オフィシャルホテル宿泊者特典」
#     ／ https://www.tokyodisneyresort.jp/hotel/tdh/service.html の詳細（ディズニーホテルの例：ランドホテル）
#   ※ hotel_privilege.html はステーションデリバリーを「有料」とだけ書き、金額は載せていない
#   ※ セレブレーションホテルはウェルカムセンターのサービス・ステーションデリバリーの対象外（ボン・ヴォヤージュで有料のバゲッジデリバリー）
# checked: 2026-10-04
bon_voyage:
  fee: { v: "800", u: yen }                  # バゲッジデリバリー 1個
  deadline: "15:00"                          # 受付締切（開店〜）
welcome_center:
  disney_hours_start: "7:30"                 # ディズニーホテルカウンター（2F）
  disney_hours_end: "16:00"
  official_hours_start: "8:00"               # オフィシャルホテルカウンター（1F）
  official_hours_end: "15:00"
station_delivery:
  fee: { v: "800", u: yen }                  # ホテル→駅 1個
  accept_start: "7:00"
  accept_end: "12:30"

