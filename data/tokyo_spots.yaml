# 東京の休息日スポット（旅行ガイド）— shortcode tokyo-spots のデータ
#
# 使い方: content/travel-guide/tokyo-rest-day-trips.*.md で {{< tokyo-spots >}} / {{< tokyo-spots "table" >}}
# ルール:
#   - page はサイト相対パス（言語接頭辞なし）。その言語に記事が無いスポットはカード・表とも自動で非表示
#   - use: half(半日) / full(1日) / evening(午後〜夜) / hours(1〜2時間)
#   - rain: ok(屋内) / part(一部屋内) / no(屋外)
#   - cost: free / paid / mixed(入場無料・一部有料)
#   - minutes: 舞浜駅からの目安（各記事の推奨ルート・乗換込み）。数値は各記事と揃える
#   - kids: 10歳未満の子連れに向く（「入れる」ではなく「向く」）
#   - 各カードの文言は編集用。料金・時刻など変わりやすい事実は記事本文に置き、ここには書かない
categories:
