# 生活ガイド共通の事実データ（単一情報源・再設計W0で骨格作成）
#
# 使い方: 記事本文で {{< fact "life.gomi.sodai_fee" >}} のように「life.」プレフィックスで参照する
#   （fact ショートコードが travel_facts と自動で振り分ける）。
#   - 葉が {v: "...", u: yen} の形なら「〜円」表記になる
#   - 葉がただの文字列ならそのまま出力する
# ルール:
#   - 値を追加・更新するときは source（公式URL）と checked（確認日）をコメント必須
#   - 手当額・窓口時間・収集ルールは年度で変わる。書く前に必ず市公式で確認する
#   - **未確認の値をここに置かない**（このファイルにある＝確認済み、を不変条件にする）
#
# 各ウェーブで記事に触るとき、その記事の共通事実をここへ移してから参照に置換する。
# （W0時点では骨格のみ。確認済みの事実から順次追加）

gomi: {}        # ごみ: 粗大ごみ手数料・受付窓口・持ち込み先 等（W1で追加）
madoguchi: {}   # 市役所: 開庁時間・休日窓口 等（W1で追加）
kokuho: {}      # 国保・年金・税: 窓口・期限 等（W1で追加）
bus: {}         # おさんぽバス: 運賃・墓地公園無料バス 等（W1で追加）
iryo: {}        # 救急・夜間: 相談電話番号 等（W1で追加）
kosodate: {}    # 手当額・医療費助成の対象年齢 等（W4で追加）
kaigo: {}       # 地域包括支援センター連絡先 等（W5で追加）
