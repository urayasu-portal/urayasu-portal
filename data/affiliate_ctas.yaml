# ============================================================
# 街のトピックス（posts）記事末尾の自動CTA定義
#
# 運用ルール：
# - 記事側の編集は一切不要。このファイルを直すだけで全記事に反映される
# - type: affiliate は url が空の間は何も表示されない
#   → ASPで提携承認されたらアフィリエイトURLを url に貼るだけで有効化
# - type: internal は内部リンク導線（PR表記なし・rel/sponsored なし）
# - tag_rules が category_rules より優先（上から順に最初にマッチした1件）
# - 表示テンプレート: layouts/partials/topic-cta.html
#
# 掲載位置（2026-07-28）：
# - 記事末尾（カード）と本文中（1行コンパクト）の2箇所に同じCTAが出る
# - 本文中は「2つ目のh2の直前」。h2が2つ未満の記事は末尾のみ
#   ※末尾CTAは90%スクロール到達＝全PVの約7%にしか見られていなかったため追加
# - inline: false … その CTA を本文中に出さない（末尾のみに戻す）
# - inline_title  … 本文中だけの短い文言（未指定なら title を流用）
# - GA4計測: topic_cta_click（params: cta_id / cta_pos=inline|full）で位置別の効果を比較できる
# ============================================================

# タグ優先ルール：記事の tags にいずれかが含まれたら適用
tag_rules:
  - tags:
      - 舞浜
      - ディズニー
      - 東京ディズニーリゾート
      - 東京ディズニーランド
      - 東京ディズニーシー
      - TDR
      - ホテル
    cta: hotel_guide

# カテゴリ→CTA（記事の categories 先頭で判定。載せないカテゴリは書かない）
#
# 読者層に合わせた出し分け（2026-07-28 見直し）：
#   ニュース記事の読者は大半が浦安の在住者で、舞浜のホテルは予約しない。
#   実測でもイベント136記事のうち Disney/舞浜タグを持つのは15記事だけだった。
#   → ローカル系カテゴリはホテルではなく、続きを読みたくなる自サイト内の
#     まとめページへ送る（回遊とAdSense表示回数、再訪の土台をつくる）。
#   → 舞浜・ディズニー・ホテルのタグが付いた記事は tag_rules が優先されるので
#     従来どおり hotel_guide のまま（訪問者向けの導線は失われない）。
# スポーツ・ニュースは適合する送客先が無いため引き続き無し（AdSenseのみ）。
category_rules:
  イベント: events_guide
  開店・閉店: openclose_guide
  開店閉店: openclose_guide
  お知らせ: life_guide
  グルメ・カフェ: gourmet
  グルメカフェ: gourmet
  子育て・教育: kosodate_guide
  子育て教育: kosodate_guide

# CTA定義本体
ctas:

  # ── 内部導線：ホテル比較ガイド（収益ページへの送客・常時有効） ──
  hotel_guide:
    type: internal
    icon: ti-building-skyscraper
    eyebrow: 舞浜・浦安に泊まるなら
    title: 舞浜・新浦安のホテルを地元目線で徹底比較
    desc: ディズニー周辺のオフィシャルホテルから駅近の格安ビジネスまで、料金目安・アクセス・設備をまとめて比較できます。
    url: /travel-guide/hotels/
    btn: ホテル比較ガイドを見る
    inline_title: 舞浜・新浦安のホテルを地元目線で比較する

  # ── 内部導線：イベントカレンダー（ローカルイベント記事の読者向け） ──
  events_guide:
    type: internal
    icon: ti-calendar-event
    eyebrow: 次のおでかけ先を探す
    title: 浦安のイベントを開催日順にまとめたカレンダー
    desc: 市内の祭り・花火・親子向けの催し・季節行事を、開催日順に一覧できます。開催中のイベントにはバッジが付きます。
    url: /events/
    btn: イベントカレンダーを見る
    inline_title: 浦安のイベントを開催日順にまとめて見る

  # ── 内部導線：開店・閉店 年表（お店の動きを追っている読者向け） ──
  openclose_guide:
    type: internal
    icon: ti-building-store
    eyebrow: 浦安のお店の動き
    title: 浦安の開店・閉店・リニューアル まとめ年表
    desc: 新しくオープンしたお店、閉店したお店、リニューアル情報を年・月ごとにまとめています。エリア別にもたどれます。
    url: /open-close/
    btn: 開店・閉店まとめを見る
    inline_title: 浦安の開店・閉店・リニューアルをまとめて見る

  # ── 内部導線：生活ガイド（市政・行政系のお知らせ記事の読者向け） ──
  life_guide:
    type: internal
    icon: ti-home-2
    eyebrow: 浦安で暮らす人へ
    title: 子育て・医療・防災・ごみ・公共施設の生活ガイド
    desc: 市役所の手続き、休日の医療、避難所、ごみの出し方など、浦安で暮らすうえで必要な情報をまとめています。
    url: /life-guide/
    btn: 生活ガイドを見る
    inline_title: 浦安の手続き・医療・防災を生活ガイドで確認する

  # ── アフィリエイト枠：グルメ・カフェ（成城石井.com／バリューコマース LinkSwitch） ──
  gourmet:
    type: affiliate
    icon: ti-shopping-bag
    eyebrow: 自宅で浦安グルメ
    title: 成城石井の味を、おうちで
    desc: アトレ新浦安1階でおなじみの成城石井。公式通販なら、人気の惣菜やワイン、輸入チーズ・スイーツをまとめてお取り寄せできます。
    url: https://www.seijoishii.com/
    btn: 成城石井.comで見る
    inline_title: 成城石井の惣菜・ワインを公式通販でお取り寄せ

  # ── 内部導線：子育て支援まとめ（子育て・教育カテゴリの記事の読者向け） ──
  # 2026-11 にモグモ（A8）の広告枠から差し替え。子育て系には広告を置かない方針（CLAUDE.md 生活ガイドの収益ルール）
  kosodate_guide:
    type: internal
    icon: ti-baby-carriage
    eyebrow: 浦安で子育てする人へ
    title: 浦安市の子育て支援・手当・助成まとめ
    desc: 妊娠・出産から小中学生まで、児童手当・子ども医療費・保育園・就学援助などの制度を時期ごとに整理しています。
    url: /life-guide/urayasu-kosodate-shien-matome/
    btn: 子育て支援まとめを見る
    inline_title: 浦安市の子育て支援・手当・助成をまとめて確認する
