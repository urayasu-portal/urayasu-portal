# posts のタグ → 常設ガイド対応表（生活ガイド再設計 W0・2026-08-16）
#
# 仕組み: posts の記事タグが下記 tags のいずれかにヒットすると、
#   記事末尾に「関連する常設ガイド」カードが自動表示される（related-guide.html）。
#   上から順に評価し、最初にマッチした1件だけを表示（多重表示しない）。
#   記事側 frontmatter の guide:（URL指定）があればそちらを優先。
#
# ルール:
#   - 「イベント」「開店・閉店」などの大票田・汎用タグは意図的に対応させない（誤誘導防止）
#   - 新しいガイドを作ったら、ここにタグ対応を追加する（CLAUDE.md 運用ルール）
#   - 緊急性の高いガイド（防災・ごみ・医療）を上位に置く

