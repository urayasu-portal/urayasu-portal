name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # 予約投稿：毎晩 22:05 JST（= 13:05 UTC 当日）に再ビルドし、
  # 公開日(date)が到来した未来日付記事を自動公開する。
  # 記事化プロンプトの公開日時ルール（リサーチ対象日 当日 22:00 JST）に合わせている。
  # ここを動かすと記事が実際に公開される時刻がずれるので、プロンプト側と必ず揃えること。
  #
  # 23:05 / 翌00:05 JST の2本は取りこぼし対策の予備。2026-08-27 は 22:05 の回が
  # GitHub 側で発火せず、その日の6記事が丸一日未公開になった。schedule は高負荷時に
  # 遅延・脱落する（実績でも毎日50分前後遅れて発火）。ビルドは冪等なので多重実行は無害。
  schedule:
    - cron: '5 13 * * *'
    - cron: '5 14 * * *'
    - cron: '5 15 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        # --buildFuture は付けない（未来日付=公開日の記事はその日まで非公開＝予約投稿）。
        # ローカルプレビュー（hugo server -F）では従来どおり未来記事を確認できる。
        run: hugo --minify --baseURL "https://urayasu-portal.com/"

      - name: Run Pagefind (search index)
        run: npx pagefind --site public

      - name: Add CNAME
        run: echo "urayasu-portal.com" > ./public/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
