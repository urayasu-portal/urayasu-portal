name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # 【公開の仕組み】記事は push 時のビルドで公開される。
  # 記事化プロンプトの公開日時ルールを「push 時点の現在時刻」に変更したため、
  # frontmatter の date が未来になることは通常なく、schedule に依存しない。
  # ここを触るときは記事化プロンプト側の日時ルールと必ず揃えること。
  #
  # 以下の schedule は保険。先の日付で書いた記事（本来の予約投稿）を拾うためと、
  # プロンプト側が旧ルール（当日22:00 JST）のまま運用された場合の受け皿。
  # 2026-08-27〜29 は 3日連続で発火せず記事が未公開になっており、これ単体は当てにしない。
  # 分を :05 から外しているのは、GitHub が「毎時00分前後は混雑し遅延・脱落しやすい」と
  # 明記しているため（従来の :05 は最悪の時間帯だった）。ビルドは冪等で多重実行は無害。
  schedule:
    - cron: '23 13 * * *'
    - cron: '47 14 * * *'
    - cron: '38 16 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        # --buildFuture は付けない（未来日付=公開日の記事はその日まで非公開＝予約投稿）。
        # ローカルプレビュー（hugo server -F）では従来どおり未来記事を確認できる。
        run: hugo --minify --baseURL "https://urayasu-portal.com/"

      - name: Run Pagefind (search index)
        run: npx pagefind --site public

      - name: Add CNAME
        run: echo "urayasu-portal.com" > ./public/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
